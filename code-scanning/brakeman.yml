# This workflow integrates Brakeman with GitHub's Code Scanning feature
# Brakeman is a static analysis security vulnerability scanner for Ruby on Rails applications

name: Brakeman Scan

on:
  push:
    branches: [ $default-branch, $protected-branches ]
  pull_request:
    # The branches below must be a subset of the branches above
    brancSuper — merci. Petite précision : voulez‑vous dire que vous avez exécuté les scripts et ajouté les secrets, ou voulez‑vous que je génère le script non‑interactif qui lit un fichier .env et injecte automatiquement les variables (moins sûr) ?

Choisissez une option (répondez par le numéro) :
1) J’ai exécuté les scripts — j’ai besoin que vous vérifiiez la PR / que je relise le code (donnez l’URL ou le numéro de la PR).  
2) Non, génère le script non‑interactif (.env → gh secret set / vercel env add).  
3) Aide pas à pas : je veux que vous me guidiez pendant que j’exécute les scripts (je collerai les sorties ici).  
4) Autre (décrivez brièvement).

Dites juste « 1 », « 2 », « 3 » ou « 4 … ». Je continue immédiatement selon votre choix hes: [ $default-branch ]
  schedule:
    - cron: $cron-weekly

permissions:
  contents: read

jobs:
  brakeman-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Brakeman Scan
    runs-on: ubuntu-latest
    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v4

    # Customize the ruby version depending on your needs
    - name: Setup Ruby
      uses: ruby/setup-ruby@55283cc23133118229fd3f97f9336ee23a179fcf # v1.146.0
      with:
        ruby-version: '2.7'

    - name: Setup Brakeman
      env:
        BRAKEMAN_VERSION: '4.10' # SARIF support is provided in Brakeman version 4.10+
      run: |
        gem install brakeman --version $BRAKEMAN_VERSION

    # Execute Brakeman CLI and generate a SARIF output with the security issues identified during the analysis
    - name: Scan
      continue-on-error: true
      run: |
        brakeman -f sarif -o output.sarif.json .

    # Upload the SARIF file generated in the previous step
    - name: Upload SARIF
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: output.sarif.json
